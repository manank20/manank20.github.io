# The URL the site will be built for
base_url = "https://www.manank.in"

# The reusable theme ships its static CSS; no Sass override is needed here.
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

title="Manank's blog"

generate_feeds = false

theme="DeepThought"
taxonomies = [
    { name = "categories", feed = true, paginate_by = 10 },
    { name = "tags", feed = true, paginate_by = 10 },
]
[markdown]
render_emoji = true

[markdown.highlighting]
theme = "github-dark-accessible"
extra_themes = ["themes/DeepThought/highlighting/github-dark-accessible.json"]


[extra]
# Put all your custom variables here
featured_page = "blog/goto-statement/index.md"
navbar_items = [
{ code = "en", nav_items = [
    { url = "$BASE_URL/", name = "Home" },
        { url = "$BASE_URL/blog", name = "Posts" },
        { url = "$BASE_URL/Manank_CV.pdf", name = "CV" },
        { url = "$BASE_URL/tags", name = "Tags" },
        { url = "$BASE_URL/categories", name = "Categories" },
] },
]

[extra.analytics]
google = "G-0083EZQFRX"

[extra.commenting]
disqus = "manank"

[extra.favicon]
favicon_16x16 = "/icons/favicon-16x16.png"
favicon_32x32 = "/icons/favicon-32x32.png"
apple_touch_icon = "/icons/apple-touch-icon.png"
safari_pinned_tab = "/icons/safari-pinned-tab.svg"
webmanifest = "/icons/site.webmanifest"

[extra.author]
name="Manank Patel"
avatar="/images/avatar.png"

[extra.social]
email="manank@manank.in"
linkedin="manank20"
github="manank20"
gitlab="manank20"
instagram="manank_p"
twitter="manank_p"
mastodon_username="manank"
mastodon_server="discuss.systems"

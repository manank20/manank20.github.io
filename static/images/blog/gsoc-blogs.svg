<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">GSoC blogs thumbnail</title>
  <desc id="desc">Abstract thumbnail representing Google Summer of Code project blog links.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="250" cy="250" r="110" fill="#fde68a"/>
  <circle cx="470" cy="250" r="110" fill="#fca5a5"/>
  <circle cx="690" cy="250" r="110" fill="#93c5fd"/>
  <circle cx="910" cy="250" r="110" fill="#86efac"/>
  <rect x="150" y="420" width="900" height="280" rx="34" fill="#f8fafc" opacity="0.96"/>
  <text x="190" y="520" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="700" fill="#0f172a">GSoC 2023</text>
  <text x="190" y="600" font-family="Inter, Arial, sans-serif" font-size="42" fill="#334155">Efficient communication with KV storage devices</text>
  <text x="190" y="665" font-family="Inter, Arial, sans-serif" font-size="36" fill="#0f766e">Project writeups and milestones</text>
</svg>
